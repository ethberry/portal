name: Deploy Migrations to Production

on:
  push:
    branches:
      - master
    paths:
      - supabase/migrations/**
      - .github/workflows/migrations.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ofpjdduxgfdkugnvigvg

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Check migrator credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Add the GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

      - name: Apply pending migrations
        run: supabase db push --yes --project-ref "$SUPABASE_PROJECT_ID" --skip-vault
